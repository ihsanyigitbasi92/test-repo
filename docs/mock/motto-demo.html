<title>Motto Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Archivo+Black&display=swap">
<style>
/* Layout: dark-first "night notebook" phone screen: coach avatar + HUD on top, a live feed of coach lines, event cards, stamps and report cards in the middle, thumb-zone actions below; full-screen takeovers (age-up, mom call, death) sit over the phone. */
:root{
  --paper:#101410; --paper-2:#181e18; --paper-3:#222a22; --ink:#f1eee2; --ink-2:#a8ab9c; --line:#3a4438;
  --lime:#c9ff3a; --lime-ink:#1a2200; --note:#ffe86b; --note-ink:#3d3000;
  --wrong:#ff4d63; --called:#5dff9a; --gold:#ffcf4a; --red-flash:rgba(255,40,60,.45); --lime-flash:rgba(201,255,58,.35); --gold-flash:rgba(255,207,74,.45);
  --coach-font:"Fraunces", Georgia, "Times New Roman", serif;
  --body-font:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --stamp-font:"Archivo Black", Impact, "Arial Black", sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --paper:#f4f1e8; --paper-2:#ebe6d8; --paper-3:#dfd9c8; --ink:#171c17; --ink-2:#5b6256; --line:#cbc4b2;
    --lime:#9fd60a; --lime-ink:#1a2200; --note:#fff1a8; --note-ink:#4a3b00;
    --wrong:#b3122b; --called:#157a3f; --gold:#c78f00; --red-flash:rgba(255,40,60,.35); --lime-flash:rgba(159,214,10,.35); --gold-flash:rgba(199,143,0,.35); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --paper:#f4f1e8; --paper-2:#ebe6d8; --paper-3:#dfd9c8; --ink:#171c17; --ink-2:#5b6256; --line:#cbc4b2;
  --lime:#9fd60a; --lime-ink:#1a2200; --note:#fff1a8; --note-ink:#4a3b00;
  --wrong:#b3122b; --called:#157a3f; --gold:#c78f00; --red-flash:rgba(255,40,60,.35); --lime-flash:rgba(159,214,10,.35); --gold-flash:rgba(199,143,0,.35); color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);font-family:var(--body-font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.phone{width:100%;max-width:420px;height:100%;max-height:860px;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:460px){.phone{border-radius:0;border-left:0;border-right:0;max-height:none}}
.phone.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate3d(-2px,0,0)}20%,80%{transform:translate3d(4px,0,0)}30%,50%,70%{transform:translate3d(-7px,0,0)}40%,60%{transform:translate3d(7px,0,0)}}
.phone.shake-hard{animation:shakeHard .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shakeHard{10%,90%{transform:translate3d(-4px,2px,0) rotate(-.5deg)}20%,80%{transform:translate3d(8px,-3px,0) rotate(.6deg)}30%,50%,70%{transform:translate3d(-12px,4px,0) rotate(-1deg)}40%,60%{transform:translate3d(12px,-4px,0) rotate(1deg)}}
@media (prefers-reduced-motion: reduce){.phone.shake,.phone.shake-hard{animation:none}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:15}
.flash.go{animation:flash .5s ease-out both}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;gap:8px}
.brand{font-family:var(--stamp-font);letter-spacing:.16em;font-size:14px;color:var(--lime)}
.brand small{display:block;font-family:var(--body-font);font-weight:600;letter-spacing:.08em;font-size:10px;color:var(--ink-2);text-transform:uppercase}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.05em;background:transparent;cursor:pointer}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.hud{padding:6px 14px 8px;display:grid;grid-template-columns:52px 1fr auto;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);position:relative}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--paper-3);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar svg{width:46px;height:46px}
.avatar .brow{transition:transform .2s}
.avatar.smirk .mouth{d:path("M14 30 Q 23 38 34 29")}
.avatar.shock .mouth{d:path("M19 30 Q 24 42 29 30 Z")}
.avatar.sad .mouth{d:path("M14 34 Q 24 27 34 34")}
.avatar.smirk .browL{transform:translateY(-3px) rotate(-10deg)}
.avatar.shock .browL,.avatar.shock .browR{transform:translateY(-5px)}
.avatar .eye{animation:blink 4.2s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.age{font-family:var(--stamp-font);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.age small{display:block;font-family:var(--body-font);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-2);text-transform:uppercase;margin-top:2px}
.who{text-align:right;font-size:11px;color:var(--ink-2);line-height:1.3}
.who b{color:var(--ink);display:block;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 8px;grid-column:1 / -1;position:relative}
.stat{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);position:relative}
.stat b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);width:50%;transition:width .5s cubic-bezier(.2,1.4,.4,1)}
.stat.jiggle{animation:jiggle .4s ease}
@keyframes jiggle{0%,100%{transform:translateY(0)}30%{transform:translateY(-3px) scale(1.06)}60%{transform:translateY(1px)}}
.meta{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.meta span{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.meta span b{color:var(--ink)}
.meta span.hot{border-color:var(--wrong);color:var(--wrong);animation:hot 1s infinite alternate}
@keyframes hot{from{box-shadow:0 0 0 0 transparent}to{box-shadow:0 0 10px 0 var(--wrong)}}
.float{position:absolute;font-family:var(--stamp-font);font-size:16px;pointer-events:none;animation:floatUp 1.1s ease-out forwards;z-index:5;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
.float.up{color:var(--called)} .float.down{color:var(--wrong)}
.feed{flex:1;overflow-y:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){.feed{scroll-behavior:auto}}
.coach{max-width:92%;align-self:flex-start;font-family:var(--coach-font);font-style:italic;font-size:17.5px;line-height:1.32;padding:8px 12px 8px 14px;border-left:3px solid var(--lime);position:relative;animation:slideIn .25s ease-out}
@keyframes slideIn{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.coach .tag{display:block;font-family:var(--body-font);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.coach.roast{border-left-color:var(--wrong)}
.coach.lift{border-left-color:var(--called)}
.cursor::after{content:"▍";color:var(--lime);animation:cur .6s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.typing{align-self:flex-start;color:var(--ink-2);font-size:12px;padding:4px 14px;letter-spacing:.2em}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;position:relative;animation:pop .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.card .label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.card .label b{color:var(--ink)}
.card p{margin:0;font-size:15.5px}
.card.doc{background:var(--paper-3);border-style:dashed}
.card.doc .tr{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.card.doc .tr b{color:var(--lime)}
.card.legend{border:2px solid var(--gold);box-shadow:0 0 24px var(--gold-flash),inset 0 0 30px rgba(255,207,74,.08);animation:legend .3s cubic-bezier(.2,1.6,.4,1), glow 1.6s ease-in-out infinite alternate}
@keyframes legend{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 12px var(--gold-flash)}to{box-shadow:0 0 34px var(--gold-flash)}}
.card.legend .label b{color:var(--gold)}
.slip{margin:10px -4px -4px;background:var(--note);color:var(--note-ink);padding:8px 10px;font-size:13px;font-weight:700;transform:rotate(-1.5deg);box-shadow:3px 4px 0 rgba(0,0,0,.35);position:relative;animation:pin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pin{from{transform:rotate(-8deg) translateY(-30px);opacity:0}to{transform:rotate(-1.5deg);opacity:1}}
.slip::before{content:"";position:absolute;top:-5px;left:14px;width:10px;height:10px;border-radius:50%;background:var(--wrong);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.slip .odds{display:block;font-weight:500;margin-top:3px;font-size:12px}
.result{font-size:14px;color:var(--ink-2);padding:0 4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.delta{font-family:var(--stamp-font);font-variant-numeric:tabular-nums;font-size:13px}
.delta.up{color:var(--called)} .delta.down{color:var(--wrong)}
.stamp{position:absolute;right:8px;top:-6px;font-family:var(--stamp-font);font-size:18px;letter-spacing:.06em;padding:4px 9px;border:3px solid currentColor;border-radius:4px;transform:rotate(-12deg);opacity:.95;pointer-events:none;text-transform:uppercase;z-index:2;background:rgba(0,0,0,.08)}
.stamp.wrong{color:var(--wrong)} .stamp.called{color:var(--called)} .stamp.neutral{color:var(--ink)} .stamp.gold{color:var(--gold)}
.stamp.anim{animation:stampIn .36s cubic-bezier(.2,1.7,.4,1) both}
@keyframes stampIn{0%{transform:rotate(-12deg) scale(3.2);opacity:0}55%{transform:rotate(-12deg) scale(.9);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:.95}}
.splat{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:splat .5s ease-out forwards;z-index:1}
@keyframes splat{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.stamp.anim,.splat,.card,.coach,.slip{animation:none}}
.bigstamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:18;pointer-events:none}
.bigstamp span{font-family:var(--stamp-font);font-size:46px;letter-spacing:.06em;border:6px solid currentColor;padding:8px 18px;border-radius:8px;transform:rotate(-14deg);text-transform:uppercase;animation:bigIn .55s cubic-bezier(.2,1.7,.4,1) both, bigOut .4s ease-in 1.1s forwards;text-align:center;line-height:1.05;max-width:90%}
@keyframes bigIn{0%{transform:rotate(-14deg) scale(4);opacity:0}60%{transform:rotate(-14deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:1}}
@keyframes bigOut{to{opacity:0;transform:rotate(-14deg) scale(1.1) translateY(-20px)}}
.note{font-family:var(--coach-font);font-style:italic;font-size:13.5px;color:var(--ink-2);padding:2px 14px;border-left:2px dotted var(--line);align-self:flex-start;max-width:90%}
.note::before{content:"Defter · ";font-family:var(--body-font);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.karne{border:2px solid var(--ink);padding:0;overflow:hidden;background:var(--paper-2)}
.karne .head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:2px solid var(--ink)}
.karne .head .t{font-family:var(--stamp-font);letter-spacing:.1em;font-size:14px}
.karne .head .y{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2)}
.grades{display:grid;grid-template-columns:1fr 1fr}
.grades div{display:flex;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px;opacity:0;transform:translateX(-8px);transition:opacity .25s,transform .25s}
.grades div.in{opacity:1;transform:none}
.grades div:nth-child(odd){border-right:1px solid var(--line)}
.grades b{font-family:var(--stamp-font);font-size:12px;letter-spacing:.05em}
.grades b.bad{color:var(--wrong)} .grades b.good{color:var(--called)}
.goal{padding:8px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.goal .st{font-family:var(--stamp-font);font-size:11px;letter-spacing:.08em;border:2px solid currentColor;padding:1px 6px;border-radius:3px;transform:rotate(-4deg)}
.motto{padding:12px 14px 10px;background:var(--lime);color:var(--lime-ink)}
.motto small{display:block;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px}
.motto q{font-family:var(--coach-font);font-style:italic;font-size:20px;line-height:1.2;quotes:"“" "”"}
.envelope{padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;background:var(--paper-3)}
.envelope .ic{width:26px;height:18px;border:2px solid var(--ink);border-radius:2px;position:relative;flex:none;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.envelope .ic::after{content:"";position:absolute;left:-2px;top:-2px;width:26px;height:18px;clip-path:polygon(0 0,100% 0,50% 60%);background:var(--ink)}
.npc{display:flex;gap:8px;align-items:flex-end;max-width:92%;align-self:flex-start;animation:slideIn .25s ease-out}
.npc .av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--stamp-font);font-size:13px;color:#111;border:2px solid var(--line)}
.npc .bub{background:var(--paper-3);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:15px}
.npc .bub small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.me{align-self:flex-end;max-width:85%;background:var(--lime);color:var(--lime-ink);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:15px;font-weight:600;animation:pop .22s ease-out}
.me small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:1px}
.dateline{align-self:center;font-family:var(--stamp-font);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:8px 12px;border:1px dashed var(--line);border-radius:999px;margin-top:4px}
.dateline b{color:var(--lime)}
.skip{align-self:center;font-size:12px;color:var(--ink-2);font-style:italic;font-family:var(--coach-font);text-align:center;max-width:85%}
.sys{align-self:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.sticker{align-self:center;background:var(--lime);color:var(--lime-ink);font-family:var(--stamp-font);font-size:15px;letter-spacing:.06em;padding:10px 16px;border-radius:4px;transform:rotate(-3deg);box-shadow:4px 5px 0 rgba(0,0,0,.4);animation:stickIn .5s cubic-bezier(.2,1.7,.4,1) both;text-align:center;max-width:95%}
.sticker small{display:block;font-family:var(--body-font);font-size:10px;letter-spacing:.16em;font-weight:700;margin-bottom:2px}
@keyframes stickIn{0%{transform:rotate(20deg) scale(2.4);opacity:0}60%{transform:rotate(-5deg) scale(.95);opacity:1}100%{transform:rotate(-3deg) scale(1)}}
.actions{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.btn{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--paper-2);border-radius:8px;padding:10px 14px;text-align:left;font-weight:600;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .08s}
.btn:hover{border-color:var(--ink)} .btn:active{transform:scale(.98)} .btn:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.btn .hint{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);justify-content:center;font-family:var(--stamp-font);letter-spacing:.12em;font-weight:400;min-height:60px;font-size:16px}
.btn.primary.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 var(--lime-flash)}50%{transform:scale(1.03);box-shadow:0 0 0 10px transparent}}
.btn.danger{background:var(--wrong);color:#fff;border-color:var(--wrong);justify-content:center;font-family:var(--stamp-font);letter-spacing:.1em;font-weight:400}
.btn.ghost{border-style:dashed;color:var(--ink-2);min-height:40px;font-weight:500;font-size:13px}
.row{display:flex;gap:8px} .row .btn{flex:1}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:16}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;background:var(--lime);animation:fall 1.8s linear forwards}
.confetti i:nth-child(3n){background:var(--gold)} .confetti i:nth-child(4n){background:var(--wrong)} .confetti i:nth-child(5n){background:var(--ink)}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:0}}
.overlay{position:absolute;inset:0;background:rgba(6,8,6,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);color:var(--ink);border-radius:12px;max-width:360px;width:100%;max-height:94%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.sheet h3{margin:0;font-family:var(--stamp-font);letter-spacing:.1em;font-size:14px;font-weight:400;color:var(--lime)}
.ageup{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:19}
.ageup .lbl{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2)}
.ageup .num{font-family:var(--stamp-font);font-size:120px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}
.ageup .pages{display:flex;gap:4px}
.ageup .pages i{width:14px;height:20px;background:var(--paper-3);border:1px solid var(--line);animation:flip .5s ease-in-out infinite alternate}
.ageup .pages i:nth-child(2){animation-delay:.1s}.ageup .pages i:nth-child(3){animation-delay:.2s}.ageup .pages i:nth-child(4){animation-delay:.3s}
@keyframes flip{to{transform:rotateY(80deg)}}
.call{position:absolute;inset:0;background:linear-gradient(180deg,#0b0f0b,#1b241b);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 20px 40px;z-index:21;color:#fff}
.call .ph{width:90px;height:90px;border-radius:50%;background:var(--wrong);display:flex;align-items:center;justify-content:center;animation:ring .5s ease-in-out infinite;box-shadow:0 0 0 12px rgba(255,77,99,.25),0 0 0 28px rgba(255,77,99,.12)}
@keyframes ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.call .ph svg{width:44px;height:44px;fill:#fff}
.call h2{font-family:var(--stamp-font);letter-spacing:.14em;margin:14px 0 4px;font-size:26px}
.call .sub{color:#c7cbbf;font-size:13px;text-align:center}
.call .q{font-family:var(--coach-font);font-style:italic;font-size:18px;text-align:center;max-width:300px;margin-top:14px;color:var(--note)}
.call .btns{display:flex;gap:14px;width:100%;max-width:320px}
.call .btns button{flex:1;min-height:56px;border:0;border-radius:12px;font-family:var(--stamp-font);letter-spacing:.08em;font-size:14px;cursor:pointer}
.call .acc{background:var(--called);color:#07210f} .call .dec{background:var(--wrong);color:#fff} .call .mute{background:#3a4438;color:#fff}

  c:[{t:{tr:'Kabul et',en:'Accept'},d:{m:-6,j:-2},tag:'kacin',line:{tr:'Kabul ettin. Ev sahibi seni gerçekten evladı gibi sevdi: sana para harcatıyor.',en:'You accepted. The landlord really does love you like family: he spends your money.'}},
     {t:{tr:'Pazarlık yap',en:'Negotiate'},tag:'risk',w:{p:55,tr:'İDDİA: "Evladım" lafı pazarlığı yener. — M.',en:'WAGER: "Like family" beats your negotiation. — M.'},
      ok:{d:{m:-2,j:3},tr:'Zam yarıya indi. Ev sahibi "sen bilirsin evladım" dedi. Bu, kazandın demek. Kutla; sessizce.',en:'Hike halved. Landlord said "whatever you think, kid." That means you won. Celebrate quietly.'},
      fail:{d:{m:-6,j:-1},tr:'Zam aynen geldi, üstüne "evladım" da. İki kere ödedin: bir para, bir gurur.',en:'Full hike, plus a "kid" on top. You paid twice: once in cash, once in pride.'}},
     {t:{tr:'Taşın',en:'Move'},d:{m:-4,j:3,l:1},tag:'risk',line:{tr:'Taşındın. Yeni ev sahibi de "evladım" dedi. Ülkede 3 milyon evlat var.',en:'You moved. The new landlord also said "kid." There are three million kids in this city.'}}]},
 {id:'fam',min:19,max:70,t:{tr:'Aile grubu: 212 okunmamış. 211\'i teyzenden: günaydın görselleri, 1\'i annenden: "Mesajları okuyor musun?"',en:'Family group chat: 212 unread. 211 from your aunt: good-morning pictures. One from your mom: "Are you reading these?"'},
  c:[{t:{tr:'Hepsini oku',en:'Read them all'},d:{mom:-10,j:-3,b:-1},tag:'anne',line:{tr:'Okudun. 211 günaydın. Kafa −1; görseller kafaya zararlı.',en:'You read them. 211 good mornings. Brain −1; the pictures are bad for you.'}},
     {t:{tr:'Görüldü, cevap yok',en:'Seen, no reply'},d:{mom:8,j:1},tag:'kacin',line:{tr:'Görüldü. Annen "görüldü"yü gördü. Teyzen de. Akşam konu sensin.',en:'Seen. Mom saw the "seen." So did your aunt. You\'re tonight\'s topic.'}},
     {t:{tr:'Sadece anneme cevap ver',en:'Reply only to Mom'},d:{mom:-4,j:1},tag:'anne',line:{tr:'"Okuyorum anne." Yalan. Deftere yazdım; annen de biliyor.',en:'"Yes Mom, reading." A lie. In the notebook; Mom knows too.'}}],unreadReset:true},
 {id:'date',min:19,max:38,t:{tr:'Flört uygulaması. Profil: "Hayatı seven, macera arayan." 14 kişi aynı cümleyi yazmış. Macera: ortak taksi.',en:'Dating app. Profile: "Loves life, seeks adventure." Fourteen people wrote the same sentence. The adventure: splitting a cab.'},
  c:[{t:{tr:'Mesaj at',en:'Send a message'},tag:'sosyal',w:{p:55,tr:'İDDİA: Cevap gelmez. — M.',en:'WAGER: No reply. — M.'},
      ok:{d:{j:8,l:1},love:true,tr:'Cevap geldi. İsmi Yağmur. Deftere yazdım; sen yazmazsın, sonra "nasıl tanışmıştık" dersin.',en:'A reply. Name\'s Sam. In the notebook; you won\'t write it down and later you\'ll ask "how did we meet."'},
      fail:{d:{j:-2},cringe:5,tr:'Cevap yok. Mesajın: "selam :)". Gülen yüz, iki nokta. Cringe +5; hak ettin.',en:'No reply. Your message: "hey :)". A smiley, a colon. Cringe +5; earned.'}},
     {t:{tr:'Uygulamayı sil',en:'Delete the app'},d:{j:2},tag:'kacin',line:{tr:'Sildin. Üç gün sonra yine yükleyeceksin. Yüklemeyi de deftere yazıyorum.',en:'Deleted. You\'ll reinstall in three days. I\'m logging the reinstall too.'}}]},
 {id:'promo',min:22,max:50,need:'job',t:{tr:'Terfi teklifi. Maaş %12, sorumluluk %140. Unvan: "Kıdemli". Kıdemli neyin? Kimse bilmiyor.',en:'Promotion offer. Salary up 12 percent, responsibility up 140. Title: "Senior." Senior what? Nobody knows.'},
  c:[{t:{tr:'Kabul et',en:'Accept'},d:{m:8,j:-4,h:-2},tag:'plan',line:{tr:'Kabul ettin. Artık toplantılarda konuşuyorsun; kimse dinlemiyor ama artık resmî.',en:'Accepted. You now speak in meetings; nobody listens, but it\'s official.'}},
     {t:{tr:'Reddet',en:'Decline'},d:{j:3},tag:'kacin',line:{tr:'Reddettin. Patron "cesur" dedi. Tercüme: listede ilk sendesin.',en:'Declined. Boss called it "brave." Translation: you\'re first on the list.'}},
     {t:{tr:'Göz temasıyla daha fazlasını iste',en:'Hold eye contact, ask for more'},tag:'risk',mini:true,
      ok:{d:{m:12,j:2},tr:'Göz teması 2,3 saniye. Patron "bu çocukta bir şey var" dedi. Ne olduğunu o da bilmiyor; zam verdi.',en:'Eye contact: 2.3 seconds. Boss said "there\'s something about this one." No idea what; gave you the raise.'},
      fail:{d:{m:8,j:-2},cringe:3,tr:'Erken kaçırdın. Patron "bir şey saklıyor" dedi. Saklıyorsun: yeteneksizliğini. Terfi yine de oldu.',en:'You blinked first. Boss said "this one\'s hiding something." You are: your lack of talent. Promoted anyway.'}}]},
 {id:'back',min:22,max:60,t:{tr:'Sırtın tutuldu. Eğilip çorap giyerken. İnternet "yaşlılık" diyor. 24 yaşındasın; internet 40 diyor.',en:'Your back went out. Putting on a sock. The internet says "aging." You\'re twenty-four; the internet says forty.'},
  c:[{t:{tr:'Doktora git',en:'See a doctor'},d:{h:6,m:-3},tag:'plan',line:{tr:'Doktor: "Yaşınıza göre normal." Yani "normal" kötü bir şey.',en:'Doctor: "Normal for your age." So "normal" is bad now.'}},
     {t:{tr:'Geçer',en:'It\'ll pass'},d:{h:-5},tag:'ertele',line:{tr:'Geçmedi. Sırtın da seni erteledi.',en:'It didn\'t pass. Your back postponed you right back.'}},
     {t:{tr:'Yoga videosu',en:'A yoga video'},d:{h:2,j:2},tag:'plan',line:{tr:'4 dakika yaptın, 40 dakika yorum okudun. Sağlık +2; yorumlar sayılmıyor.',en:'Four minutes of yoga, forty minutes of comments. Health +2; comments don\'t count.'}}]},
 {id:'courier',min:19,max:60,t:{tr:'Kurye: "Adreste bulunamadı." Evdeydin. Kapıyı tutuyordun. Kurye seninle göz göze geldi ve yazdı.',en:'Courier: "Recipient not found." You were home. Holding the door. The courier made eye contact with you and typed it anyway.'},
  c:[{t:{tr:'Peşinden koş',en:'Chase him'},d:{h:2,j:-3},tag:'risk',line:{tr:'Yetişemedin. Kurye 1, sen 0. Paket "dağıtımda". Sen de.',en:'Didn\'t catch him. Courier 1, you 0. Package "out for delivery." So are you.'}},
     {t:{tr:'Şikâyet yaz',en:'File a complaint'},d:{j:-1},cringe:3,tag:'plan',line:{tr:'Şikâyetin "değerlendirildi". Yani okunmadı. Üç paragraf yazmıştın; biri büyük harfle.',en:'Your complaint was "reviewed." Meaning unread. Three paragraphs; one in caps.'}},
     {t:{tr:'Kabullen',en:'Accept fate'},d:{j:1},tag:'kacin',line:{tr:'Kabullendin. Olgunluk mu, teslimiyet mi? Dosyaya "ikisi" yazdım.',en:'You accepted it. Maturity or surrender? I wrote "both."'}}]},
 {id:'boiler',min:21,max:70,t:{tr:'Kombi bozuldu. Usta "pazartesi" dedi. Üç pazartesi geçti. Pazartesi bir gün değil, bir kavram.',en:'The boiler died. The repairman said "Monday." Three Mondays have passed. Monday isn\'t a day, it\'s a concept.'},
  c:[{t:{tr:'Battaniyeyle idare et',en:'Blankets'},d:{h:-3,m:1},tag:'ertele',line:{tr:'Üç battaniye. Soğuktan değil, gururdan titriyorsun.',en:'Three blankets. You\'re shivering from pride, not cold.'}},
     {t:{tr:'Yeni usta çağır',en:'Call another guy'},d:{m:-6,h:1},tag:'harca',line:{tr:'Yeni usta "bunu kim yapmış" dedi. Eski usta. Fatura: iki usta.',en:'New guy said "who did this?" The old guy. Bill: two guys.'}},
     {t:{tr:'Kendin tamir et',en:'Fix it yourself'},tag:'risk',w:{p:65,tr:'İDDİA: Patlatırsın. — M.',en:'WAGER: You\'ll blow it up. — M.'},
      ok:{d:{h:2,j:6,b:2},tr:'Çalıştı. Mucize. Not: mucizeleri saymıyorum; bu bir tane.',en:'It works. A miracle. Note: I don\'t count miracles. This one I did.'},
      fail:{d:{m:-8,h:-2},tr:'Daha da bozuldu. Usta artık "çarşamba" diyor. Çarşamba da bir kavram.',en:'Now it\'s worse. The repairman says "Wednesday" now. Wednesday is also a concept.'}}]},
 {id:'post',min:20,max:50,t:{tr:'Sosyal medyada "Yeni bir yolculuğa başlıyorum" yazdın. 4 beğeni: annen, bir bot, eski sevgilinin iki arkadaşı. İzliyorlar.',en:'You posted "Starting a new journey." Four likes: your mom, a bot, and two of your ex\'s friends. They\'re watching.'},
  c:[{t:{tr:'Yolculuğu anlat',en:'Explain the journey'},d:{j:-2},cringe:6,tag:'sosyal',line:{tr:'Anlattın. 11 paragraf. Beğeni: 4\'te kaldı. Bot bile gitti.',en:'You explained. Eleven paragraphs. Still four likes. Even the bot left.'}},
     {t:{tr:'Sil',en:'Delete it'},d:{j:1},tag:'kacin',line:{tr:'Sildin. Ekran görüntüsü alındı. Eski sevgilinin arkadaşı hızlı.',en:'Deleted. Screenshot taken. Your ex\'s friend is fast.'}},
     {t:{tr:'Gerçekten yola çık',en:'Actually start the journey'},d:{j:4,m:-3,b:2},tag:'plan',line:{tr:'Çıktın. Nereye, belli değil; ama ilk kez paylaşım ile hayat aynı yönde.',en:'You went. Where, unclear; but for once the post and the life point the same way.'}}]},
 {id:'night',min:20,max:65,t:{tr:'Gece 03:12. Tavana bakıyorsun. Tavan da sana. İkiniz de bir şey söylemiyorsunuz. Sağlıklı.',en:'3:12 a.m. You\'re staring at the ceiling. The ceiling stares back. Neither of you says anything. Healthy.'},
  c:[{t:{tr:'Uyumaya çalış',en:'Try to sleep'},d:{h:2},tag:'plan',line:{tr:'Uyudun. 04:50\'de. Alarm 07:00. Matematik: kötü.',en:'You slept. At 4:50. Alarm at 7. The math: bad.'}},
     {t:{tr:'Telefona bak',en:'Check your phone'},d:{h:-3,j:-2},cringe:4,tag:'ertele',line:{tr:'Eski sevgilinin yeni sevgilisinin kedisinin hesabını buldun. Kedi mutlu. Sen değil.',en:'You found your ex\'s new partner\'s cat\'s account. The cat is happy. You are not.'}},
     {t:{tr:'Hayatı sorgula',en:'Question everything'},d:{b:2,j:-1},tag:'plan',line:{tr:'Sorguladın. Cevap gelmedi. Cevap da "görüldü" yapıyor.',en:'You questioned. No answer. The answer left you on read.'}}]},
 {id:'wedding',min:23,max:50,t:{tr:'Düğün. Masa 14. Masada seni tanıyan tek kişi: garson. O da emin değil. Takı sırası geldi.',en:'A wedding. Table 14. The only person who knows you: the waiter. He\'s not sure either. Gift line is moving.'},
  c:[{t:{tr:'Çeyrek tak',en:'Gold coin'},d:{m:-5,j:3,l:1},tag:'harca',line:{tr:'Taktın. Mikrofondan adın okundu, yanlış. "Deniz Erteleyen". Yakın.',en:'Pinned it. Your name was announced, wrong. Close enough; they got the surname\'s spirit.'}},
     {t:{tr:'Zarf, miktar belirsiz',en:'Envelope, amount vague'},d:{m:-2},cringe:4,tag:'biriktir',line:{tr:'Zarf açıldı. Masa 14 sustu. Garson bile.',en:'The envelope was opened. Table 14 went quiet. Even the waiter.'}},
     {t:{tr:'Halaya katıl, takıyı atla',en:'Dance, skip the gift'},d:{j:5,h:-1},tag:'sosyal',line:{tr:'Halay çektin. Video var. Deftere "kanıt" yazdım.',en:'You danced. There\'s video. I wrote "evidence" in the notebook.'}}]},
 {id:'crypto',min:21,max:55,t:{tr:'Ev arkadaşın Barış "kesin" bir şey buldu. Barış\'ın bir önceki "kesin"i hâlâ kayıp. Polis bile aramıyor.',en:'Your roommate Jordan found a "sure thing." Jordan\'s previous sure thing is still missing. Not even the police are looking.'},
  c:[{t:{tr:'Yatır',en:'Invest'},tag:'risk',w:{p:60,tr:'İDDİA: Para Mart\'ı görmez. — M.',en:'WAGER: This money doesn\'t see March. — M.'},
      ok:{d:{m:12,j:5},tr:'Tuttu. Barış haklıydı. Bunu bir daha yazmayacağım; mürekkep pahalı, Barış ucuz.',en:'It landed. Jordan was right. I will never write that again; ink is expensive, Jordan is cheap.'},
      fail:{d:{m:-10,j:-3},tr:'Gitti. Barış "piyasa" dedi. Deftere "Barış" yazdım, altını çizdim, üstünü de.',en:'Gone. Jordan said "the market." I wrote "Jordan" in the notebook, underlined it, then overlined it.'}},
     {t:{tr:'Yatırma',en:'Pass'},d:{m:0},ego:2,tag:'biriktir',line:{tr:'Hayır dedin. Ego +2. Barış küstü. Barış\'ın küsmesi de bir stat; düşük.',en:'You said no. Ego +2. Jordan sulked. Jordan\'s sulking is also a stat; low.'}}]},
 {id:'house',min:30,max:60,t:{tr:'Herkes ev alıyor. Sen "bir şeyler" biriktiriyorsun. "Bir şeyler" faiz getirmiyor; "bir şeyler" ev de değil.',en:'Everyone\'s buying a house. You\'re saving "some things." Some things don\'t earn interest; some things aren\'t a house.'},
  c:[{t:{tr:'30 yıllık kredi çek',en:'Take the 30-year loan'},d:{m:-8,j:2},tag:'risk',line:{tr:'30 yıl. Ben 30 yıl kimseyle konuşmadım. Sen bankayla konuşacaksın; her ay.',en:'Thirty years. I haven\'t spoken to anyone for thirty years. You\'ll speak to the bank; monthly.'}},
     {t:{tr:'Kirada kal',en:'Keep renting'},d:{m:1},tag:'biriktir',line:{tr:'Kirada kaldın. Ev sahibin ev aldı. Senin paranla.',en:'Still renting. Your landlord bought a house. With your money.'}},
     {t:{tr:'Anneme sor',en:'Ask Mom'},d:{mom:-8,m:2},tag:'anne',line:{tr:'Annen "yanımıza taşın" dedi. Konu kapandı; ev konusu değil, sen konusu.',en:'Mom said "move back in." Topic closed; not the house topic, the you topic.'}}]},
 {id:'cat',min:26,max:75,t:{tr:'Kapıda bir kedi. Senin değil. Artık senin. Kedi karar verdi; sen sadece haberdar edildin.',en:'A cat at the door. Not yours. Yours now. The cat decided; you were merely informed.'},
  c:[{t:{tr:'İçeri al',en:'Let it in'},d:{j:6,m:-2},tag:'sosyal',line:{tr:'Adı Pamuk. O koydu. Kira sözleşmesine de o baktı; "evcil hayvan yasak" maddesini yedi.',en:'Name\'s Biscuit. The cat chose it. Also reviewed your lease; ate the "no pets" clause.'}},
     {t:{tr:'Alma',en:'Don\'t'},d:{j:-2},tag:'kacin',line:{tr:'Kedi seni aldı. Mahallede konuşuluyor: "şu kedinin insanı".',en:'The cat took you. The street talks: "that cat\'s human."'}}]},
 {id:'gym',min:20,max:65,t:{tr:'Spor salonu: 11 ay ödendi, 2 kez gidildi. Salon seni "en sadık üye" seçti. Ödül: bir ay daha.',en:'Gym: eleven months paid, two visits. The gym named you "most loyal member." Prize: one more month.'},
  c:[{t:{tr:'Bu hafta git',en:'Go this week'},d:{h:4,j:2},tag:'plan',line:{tr:'Gittin. 20 dakika. 12\'si soyunma odasında. Sayıyorum.',en:'You went. Twenty minutes. Twelve in the locker room. I\'m counting.'}},
     {t:{tr:'Gelecek ay',en:'Next month'},d:{h:-1},tag:'ertele',line:{tr:'Gelecek ay. Deftere yazdım. 14. kez. Sayfa bitti.',en:'Next month. Written down. For the fourteenth time. Page is full.'}},
     {t:{tr:'İptal et',en:'Cancel'},d:{m:3},tag:'biriktir',line:{tr:'İptal için salona gittin. 11 ayda ilk kez terledin: formlar.',en:'You went to the gym to cancel. First sweat in eleven months: the forms.'}}]},
 {id:'hr',min:23,max:58,need:'job',doc:true,t:{tr:'İK e-postası: "Değerli ekip arkadaşımız, bu çeyrek esnek bir tasarruf dönemine giriyoruz."',en:'HR email: "Dear valued team member, this quarter we enter a period of flexible savings."'},tr:{tr:'zam yok, ikramiye yok, çay şirketten değil artık.',en:'no raise, no bonus, and the office coffee is now your problem.'},
  c:[{t:{tr:'"Anlayışla karşılıyorum" yaz',en:'Reply "I understand"'},d:{j:-2},cringe:2,tag:'kacin',line:{tr:'Yazdın. İK "harika enerji" dedi. Enerjin yok; onu da kestiler.',en:'You replied. HR said "great energy." You have none; they cut that too.'}},
     {t:{tr:'Kendi çayını getir',en:'Bring your own coffee'},d:{m:-1,j:2},tag:'plan',line:{tr:'Termos aldın. Termos işte senden çok sevildi.',en:'You bought a thermos. The thermos is more popular at work than you.'}},
     {t:{tr:'Yeni iş ara',en:'Look for a new job'},d:{b:2,j:1},tag:'plan',line:{tr:'Aradın. Bütün ilanlar "aile". Ülke tek aile; sen hâlâ uzaktan akraba.',en:'You looked. Every listing says "family." The whole country is one family; you\'re still the distant cousin.'}}]},
 {id:'old',min:55,max:90,t:{tr:'Torunun (ya da komşunun torunu) telefonu "eski" buldu. Telefon iki yaşında. Sen değilsin.',en:'Your grandkid (or the neighbor\'s) called your phone "old." The phone is two. You are not.'},
  c:[{t:{tr:'Yenisini al',en:'Buy a new one'},d:{m:-4,j:2},tag:'harca',line:{tr:'Aldın. Çocuk "bu da eski" dedi. Bir hafta geçmişti.',en:'Bought it. The kid said "this one\'s old too." It had been a week.'}},
     {t:{tr:'Bu iyi',en:'This one\'s fine'},d:{j:1},ego:2,tag:'biriktir',line:{tr:'"Bu iyi." Telefon da seni iyi buluyor. Birbirinize yetiyorsunuz.',en:'"This one\'s fine." The phone thinks you\'re fine too. You\'re enough for each other.'}}]},

const wait=(ms)=>new Promise(r=>setTimeout(r, RM()?Math.min(ms,60):ms));

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fmtDate(ms){ try{ return new Intl.DateTimeFormat(lang==='tr'?'tr-TR':'en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(ms)); }catch(e){ return new Date(ms).toDateString(); } }
function dateLine(){ feed.appendChild(el(`<div class="dateline"><b>${esc(T(UI.day))} ${S.dayIdx}</b> · ${esc(fmtDate(S.date))}</div>`)); scrollDown(); }
async function npcSay(d){ const n=NPC[d.w]; const ty=el(`<div class="typing">•••</div>`); feed.appendChild(ty); scrollDown(); await wait(260); ty.remove();
  feed.appendChild(el(`<div class="npc"><div class="av" style="background:${n.c}">${esc(n.i)}</div><div class="bub"><small>${esc(T(n))}</small>${esc(T(d))}</div></div>`)); SFX.tick(); scrollDown(); await wait(240); }
async function npcDialog(id){ const lines=DIALOG[id]; if(!lines) return; for(const d of lines) await npcSay(d); }
function meSay(text){ feed.appendChild(el(`<div class="me"><small>${esc(T(UI.you))}</small>${esc(text)}</div>`)); scrollDown(); }
function skipDays(){ const a=S.age; const max=a<26?22:a<41?35:a<61?55:80; return 1+Math.floor(rnd()*max); }
async function advanceDays(n){ S.date+=n*86400000; S.dayIdx++; S.daysInYear+=n; S.unread+=Math.floor(n/2); S.mom=clamp(S.mom+n*0.25,0,100); if(n>3){ feed.appendChild(el(`<div class="skip">${esc(pick(UI.skipLines[lang])(n))}</div>`)); scrollDown(); await wait(350);} hudRender(); }
/* ================= FX ================= */
function shake(hard){ if(RM()) return; phone.classList.remove('shake','shake-hard'); void phone.offsetWidth; phone.classList.add(hard?'shake-hard':'shake'); }
function flash(kind){ const f=document.getElementById('flash'); f.style.background=kind==='red'?'var(--red-flash)':kind==='gold'?'var(--gold-flash)':'var(--lime-flash)'; f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function mood(m){ avatar.className='avatar'+(m?' '+m:''); if(m) setTimeout(()=>{avatar.className='avatar';},2600); }
function floatNum(text, up){ const hudEl=document.getElementById('hud'); const f=el(`<div class="float ${up?'up':'down'}">${esc(text)}</div>`); f.style.left=(20+rnd()*60)+'%'; f.style.top='60%'; hudEl.appendChild(f); setTimeout(()=>f.remove(),1200); }
function splatter(card, color){ if(RM()) return; for(let i=0;i<10;i++){ const s=el(`<i class="splat"></i>`); s.style.background=color; s.style.right=(14+rnd()*30)+'px'; s.style.top=(4+rnd()*20)+'px'; s.style.setProperty('--dx',(rnd()*80-40)+'px'); s.style.setProperty('--dy',(rnd()*60-20)+'px'); card.appendChild(s); setTimeout(()=>s.remove(),600);} }
function stampOn(card, kind, text, big){ const s=el(`<div class="stamp ${kind} anim">${esc(text)}</div>`); card.appendChild(s);
  if(kind==='wrong'){ SFX.slam(); shake(true); flash('red'); splatter(card,'var(--wrong)'); mood('shock'); if(big!==false) bigStamp(text,'var(--wrong)'); }
  else if(kind==='called'){ SFX.thud(); shake(false); flash('lime'); splatter(card,'var(--called)'); mood('smirk'); if(big!==false) bigStamp(text,'var(--called)'); }
  else if(kind==='gold'){ SFX.gold(); flash('gold'); splatter(card,'var(--gold)'); mood('shock'); }
  else { SFX.thud(); }
}
function bigStamp(text,color){ if(RM()) return; const host=document.getElementById('fxHost'); const b=el(`<div class="bigstamp"><span style="color:${color}">${esc(text)}</span></div>`); host.appendChild(b); setTimeout(()=>b.remove(),1700); }
function confetti(){ const c=document.getElementById('confetti'); if(RM()) return; c.hidden=false; c.innerHTML=''; for(let i=0;i<60;i++){ const p=document.createElement('i'); p.style.left=(rnd()*100)+'%'; p.style.animationDelay=(rnd()*.6)+'s'; c.appendChild(p);} setTimeout(()=>{c.hidden=true;c.innerHTML='';},2600); }
async function typeInto(node, text){
  if(RM()){ node.textContent=text; return; }
  node.classList.add('cursor'); node.textContent='';
  for(let i=0;i<text.length;i++){ node.textContent+=text[i]; if(i%3===0) SFX.tick(); await wait(text[i]===' '?8:14); }
  node.classList.remove('cursor');
}
async function coach(text, kind){
  const ty=el(`<div class="typing">•••</div>`); feed.appendChild(ty); scrollDown(); await wait(300); ty.remove();
  const b=el(`<div class="coach ${kind||''}"><span class="tag">${T(UI.coach)}</span><span class="txt"></span></div>`); feed.appendChild(b); scrollDown();
  await typeInto(b.querySelector('.txt'), text); scrollDown(); await wait(180);
}
function sys(text){ feed.appendChild(el(`<div class="sys">${esc(text)}</div>`)); scrollDown(); }
function setActions(list){ actions.innerHTML=''; list.forEach(a=>{ const b=el(`<button type="button" class="btn ${a.cls||''}">${esc(a.label)}${a.hint?`<span class="hint">${esc(a.hint)}</span>`:''}</button>`); b.addEventListener('click',()=>{ ac(); b.disabled=true; a.on(); }); actions.appendChild(b); }); }
function hudRender(changed){
  if(!S.hudShown) return; hud.hidden=false;
  document.getElementById('ageNum').textContent=S.age;
  document.getElementById('ageLbl').textContent=`${T(UI.age)} · ${new Date(S.date).getFullYear()}`;
  document.getElementById('lifeLbl').textContent=UI.life[lang](S.life);
  document.getElementById('nameLbl').textContent=S.name;
  const names=UI.stats[lang], vals=[S.h,S.j,S.b,S.l], keys=['h','j','b','l'];
  document.getElementById('stats').innerHTML=names.map((n,i)=>`<div class="stat ${changed&&changed[keys[i]]?'jiggle':''}">${n}<b>${Math.round(vals[i])}</b><div class="bar"><i style="width:${clamp(vals[i],0,100)}%"></i></div></div>`).join('');
  document.getElementById('metaRow').innerHTML=`<span>${T(UI.money)}: <b>${Math.round(S.m)}</b></span><span>${T(UI.unread)}: <b>${S.unread}</b></span><span class="${S.mom>=75?'hot':''}">${T(UI.mom)}: <b>${Math.round(S.mom)}</b></span><span>${T(UI.cringe)}: <b>${S.cringe}</b></span>`;
}
function applyDelta(d, extra){
  d=d||{}; const parts=[]; const changed={};
  const map={h:0,j:1,b:2,l:3};
  for(const k of ['h','j','b','l']){ if(d[k]){ S[k]=clamp(S[k]+d[k],0,100); parts.push([UI.stats[lang][map[k]],d[k]]); changed[k]=true; } }
  if(d.m){ S.m=S.m+d.m; parts.push([T(UI.money),d.m]); }
  if(d.mom){ S.mom=clamp(S.mom+d.mom,0,100); parts.push([T(UI.mom),d.mom]); }
  if(extra&&extra.cringe){ S.cringe+=extra.cringe; parts.push(['Cringe',extra.cringe]); }
  if(extra&&extra.ego){ S.ego+=extra.ego; parts.push(['Ego',extra.ego]); }
  if(S.m<0){ S.m=4; parts.push([T(UI.noMoney),0]); }
  hudRender(changed);
  const sum=parts.reduce((a,[n,v])=>a+v,0);
  parts.forEach(([n,v],i)=>{ if(v) setTimeout(()=>floatNum((v>0?'+':'−')+Math.abs(v)+' '+n, v>0), i*120); });
  if(d.m>8){ SFX.cash(); flash('lime'); } else if(sum<-5){ SFX.sad(); flash('red'); mood('sad'); } else if(sum>4){ SFX.ding(); }
  return parts;
}
function deltaHtml(parts){ return parts.map(([n,v])=>v===0?`<span class="delta">${esc(n)}</span>`:`<span class="delta ${v>0?'up':'down'}">${esc(n)} ${v>0?'+':'−'}${Math.abs(v)}</span>`).join(''); }
function bumpPat(tag){ if(!tag) return; S.pat[tag]=(S.pat[tag]||0)+1; }
async function checkTeshis(){
  for(const t of TESHIS){ if((S.pat[t.k]||0)>=t.n && !S.teshis.includes(t.k)){ S.teshis.push(t.k);
    const s=el(`<div class="sticker"><small>${esc(T(UI.teshis))}</small>${esc(T(t))}</div>`); feed.appendChild(s); scrollDown(); SFX.slam(); shake(true); flash('lime'); mood('smirk'); await wait(700); await coach(T(t.line),'roast'); } }
}

function eventCard(ev, label, legend){
  const html=ev.doc
    ?`<div class="card doc"><div class="label"><span>${esc(label)}</span><b>${esc(T(UI.doc))}</b></div><p>${esc(T(ev.t))}</p><div class="tr"><b>${esc(T(UI.translate))}:</b> ${esc(T(ev.tr))}</div></div>`
    :`<div class="card ${legend?'legend':''}"><div class="label"><span>${esc(legend?T(UI.legend):label)}</span><b>${S.age} ${esc(T(UI.age))}</b></div><p>${esc(T(ev.t))}</p></div>`;
  const c=el(html); feed.appendChild(c); scrollDown(); if(legend){ SFX.gold(); flash('gold'); confetti(); shake(false); mood('shock'); } else SFX.tick(); return c;
}
function miniGame(){
  return new Promise(resolve=>{
    const m=el(`<div class="mini"><div class="lbl"><span>${esc(T(UI.miniLbl))}</span><span>2.3s</span></div><div class="track"><div class="needle"></div></div></div>`);
    feed.appendChild(m); scrollDown(); const needle=m.querySelector('.needle'); const t0=performance.now();
    setActions([{label:T(UI.now),cls:'danger',on:()=>{ needle.classList.add('stop'); const t=(performance.now()-t0)/1000; const phase=(t/1.05)%2; const pos=phase<1?phase:2-phase; const win=pos>=.42&&pos<=.58; needle.style.left=`calc(${pos*100}% - 2px)`; resolve(win); }}]);
  });
}
function runEvent(ev, legend){
  return new Promise(async resolve=>{
    await npcDialog(ev.id);
    const card=eventCard(ev, T(UI.event), legend);
    const wagerChoice=ev.c.find(x=>x.w);
    if(wagerChoice){ setTimeout(()=>{ card.appendChild(el(`<div class="slip">${esc(T(wagerChoice.w))}</div>`)); SFX.tick(); scrollDown(); },350); }
    setActions(ev.c.map(ch=>({label:T(ch.t), on:async()=>{
      S.decisions++; bumpPat(ch.tag); meSay(T(ch.t)); await wait(200);
      if(ev.unreadReset) S.unread=1;
      let parts=[], line=null, kind='';
      if(ch.w){
        const fail=rnd()*100 < ch.w.p;
        const out=fail?ch.fail:ch.ok;
        if(fail){ S.wagersWon++; stampOn(card,'called',T(UI.called)); } else { S.wagersLost++; stampOn(card,'wrong',T(UI.wrong)); S.lastMissWager={age:S.age,t:T(ev.t)}; }
        await wait(500);
        parts=applyDelta(out.d, out); if(out.love) S.loves++; if(out.job===false) S.job=false; if(out.job===true) S.job=true;
        card.querySelector('.slip').insertAdjacentHTML('beforeend',`<span class="odds">${UI.odds[lang](ch.w.p)}</span>`);
        line=T(out); kind=fail?'roast':'lift';
      } else if(ch.mini){
        setActions([]); const win=await miniGame(); const out=win?ch.ok:ch.fail;
        stampOn(card, win?'called':'wrong', win?T(UI.called):T(UI.wrong), true); await wait(500);
        parts=applyDelta(out.d, out); line=T(out); kind=win?'lift':'roast';
      } else {
        parts=applyDelta(ch.d, ch); if(ch.love) S.loves++; if(ch.job) S.job=true;
        stampOn(card,legend?'gold':'neutral',legend?'★':T(UI.processed));
        line=ch.line?T(ch.line):null; kind=(parts.reduce((a,[n,v])=>a+v,0)<0)?'roast':'';
      }
      feed.appendChild(el(`<div class="result">${deltaHtml(parts)}</div>`)); scrollDown();
      if(line) await coach(line, kind);
      await checkTeshis();
      setActions([]); resolve();
    }})));
  });
}
function pickEvent(){
  if(S.legendSeen<1 && S.age>=20 && rnd()<.18){ const pool=LEGEND.filter(e=>S.age>=e.min&&S.age<=e.max&&!S.seen[e.id]); if(pool.length){ const e=pick(pool); S.seen[e.id]=true; S.legendSeen++; return {ev:e,legend:true}; } }
  const pool=EV.filter(e=>S.age>=e.min&&S.age<=e.max&&!S.seen[e.id]&&(!e.need||S.job));
  if(!pool.length) return null;
  const e=pick(pool); S.seen[e.id]=true; return {ev:e,legend:false};
}
async function goalCard(){
  await coach(T(COACH.goalAsk));
  const opts=GOALS.filter(g=>S.age>=g.min&&S.age<=g.max).sort(()=>rnd()-.5).slice(0,3);
  return new Promise(resolve=>{
    setActions([...opts.map(g=>({label:T(g),on:()=>{S.goal=T(g);S.decisions++;bumpPat('plan');SFX.tick();setActions([]);resolve();}})),{label:T(NO_GOAL),cls:'ghost',on:()=>{S.goal=null;S.decisions++;setActions([]);resolve();}}]);
  });
}
function gradeOf(v){ return v<35?0:v<50?1:v<65?2:v<80?3:4; }
async function karne(){
  const moneyG=gradeOf(clamp(S.m*1.6,0,100));
  const rel=clamp(40+S.loves*15-(S.pat.kacin||0)*4+(S.pat.sosyal||0)*5,0,100);
  const cour=clamp(30+(S.pat.risk||0)*12,0,100);
  const cond=clamp(70-(S.pat.kacin||0)*5-S.cringe*0.6+(S.pat.plan||0)*4,0,100);
  const g=[gradeOf(S.h),moneyG,gradeOf(rel),gradeOf(S.b),gradeOf(cour),gradeOf(cond)];
  const goalSt=S.goal? (rnd()<.3?2:1) : 0; if(goalSt===2) S.goalDone++;
  const motto=!S.lastKarne?MOTTOS[0]:pick(MOTTOS.slice(1));
  const hasEnv=S.env.length>0 || (S.age>=22 && rnd()<.6);
  if(hasEnv && !S.env.length){ const pool=ENVELOPES.filter(e=>S.age>=e.min&&S.age<=e.max&&!S.seen[e.id]&&(!e.need||S.job)); if(pool.length){ const e=pick(pool); S.seen[e.id]=true; S.env.push(e);} }
  const names=UI.gradeNames[lang], gl=UI.grades[lang];
  const k=el(`<div class="card karne">
    <div class="head"><span class="t">${esc(T(UI.karne))} ${S.year}</span><span class="y">${esc(S.name)} · ${S.age}</span></div>
    <div class="grades">${names.map((n,i)=>`<div><span>${n}</span><b class="${g[i]<=1?'bad':g[i]>=3?'good':''}">${gl[g[i]]}</b></div>`).join('')}</div>
    <div class="goal"><span>${esc(T(UI.goal))}: ${esc(S.goal||T(NO_GOAL))}</span><span class="st">${esc(UI.goalSt[lang][goalSt])}</span></div>
    <div class="motto"><small>${esc(T(UI.mottoLbl))}</small><q class="mq"></q></div>
    <div class="envelope"><span class="ic"></span><span>${esc(S.env.length?T(UI.envLine):T(UI.envNone))}</span></div>
  </div>`);
  feed.appendChild(k); scrollDown();
  const rows=k.querySelectorAll('.grades div'); for(const r of rows){ await wait(90); r.classList.add('in'); SFX.tick(); }
  await wait(150); stampOn(k,'neutral',T(UI.approved)); SFX.thud();
  await typeInto(k.querySelector('.mq'), T(motto)); scrollDown();
  S.lastKarne={g:g.map(i=>gl[i]),motto:T(motto),year:S.year};
  if(S.years===1) confetti();
  if(S.env.length){ SFX.tick(); }
}
async function ageUpAnim(){
  const host=document.getElementById('fxHost'); const from=S.age, to=S.age+1;
  const o=el(`<div class="ageup"><div class="lbl">${esc(T(UI.agingLbl))}</div><div class="num">${from}</div><div class="pages"><i></i><i></i><i></i><i></i></div></div>`); host.appendChild(o);
  SFX.whistle(); await wait(RM()?60:650); o.querySelector('.num').textContent=to; SFX.thud(); shake(false); await wait(RM()?60:450); o.remove();
}
function ageUp(){
  S.age++; S.year++; S.years++;
  if(S.age>30) S.h-=1; if(S.age>50) S.h-=1.5; if(S.age>65) S.h-=2;
  S.l-= S.age>35?1:0; S.m += S.job? 6 : 1; S.m -= 3; S.j -= 1; S.year=new Date(S.date).getFullYear();
  S.h=clamp(S.h,0,100); S.j=clamp(S.j,0,100); S.l=clamp(S.l,0,100); S.mom=clamp(S.mom,0,100);
  hudRender();
}
function hazard(){ const a=S.age; const base=0.00043*Math.exp(0.0866*(a-18)); const mult=1+(100-S.h)/50; return a<28?0:base*mult; }
function yearIntro(){ const b=COACH.band.find(x=>S.age<=x.max); return b[lang](S.age); }

/* ================= MOM CALL ================= */
function momCall(){
  return new Promise(resolve=>{
    const host=document.getElementById('overlayHost'); const q=pick(MOMCALLS);
    host.innerHTML=`<div class="call"><div><div class="ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg></div></div>
      <div style="text-align:center"><h2>${esc(T(UI.mom))}</h2><div class="sub">${esc(T(UI.momSub))}</div><div class="q">${esc(T(q.q))}</div></div>
      <div class="btns"><button type="button" class="dec" id="cDec">${esc(T(UI.decline))}</button><button type="button" class="mute" id="cMute">${esc(T(UI.muteBtn))}</button><button type="button" class="acc" id="cAcc">${esc(T(UI.accept))}</button></div></div>`;
    SFX.ring(); shake(false); S.momCalled++;
    const done=async(kind)=>{ host.innerHTML=''; S.decisions++;
      if(kind==='acc'){ bumpPat('anne'); applyDelta({mom:-14,j:rnd()<.5?3:-2}); await coach(T(q.acc)); }
      else if(kind==='dec'){ bumpPat('kacin'); applyDelta({mom:16,j:1}); await coach(lang==='tr'?'Reddettin. Annen "meşguldür" dedi. Teyzene "ilgilenmiyor" dedi. İkisi de doğru.':'Declined. Mom said "must be busy." To your aunt she said "doesn\'t care." Both true.','roast'); }
      else { bumpPat('kacin'); applyDelta({mom:9},{cringe:3}); await coach(lang==='tr'?'Sessize aldın. Telefon 6 kez daha titredi. Masa da titredi. Sen de.':'Muted. The phone buzzed six more times. So did the table. So did you.','roast'); }
      await checkTeshis(); resolve(); };
    document.getElementById('cAcc').addEventListener('click',()=>done('acc'));
    document.getElementById('cDec').addEventListener('click',()=>done('dec'));
    document.getElementById('cMute').addEventListener('click',()=>done('mute'));
  });
}

/* ================= FLOWS ================= */
async function start(){
  feed.innerHTML=''; setActions([]); hud.hidden=true; document.getElementById('overlayHost').innerHTML='';
  await wait(400);
  if(S.life>1){ await coach(T(COACH.newLife[Math.min(S.life-2,1)])); }
  await coach(T(COACH.intro1),'roast'); await coach(T(COACH.intro1b)); await coach(T(COACH.intro2));
  await nameCard();
}
async function nameCard(){
  const roll=()=>{ const [n,c]=pick(NAMES[lang]); S.name=n; S.city=c; SFX.tick(); };
  roll();
  const card=el(`<div class="card"><div class="label"><span>${lang==='tr'?'MÜŞTERİ DOSYASI':'CLIENT FILE'}</span><b>#${String(S.life).padStart(3,'0')}</b></div><p><b id="nm"></b> · 18 · <span id="ct"></span></p></div>`);
  feed.appendChild(card); scrollDown();
  const paint=()=>{ card.querySelector('#nm').textContent=S.name; card.querySelector('#ct').textContent=S.city; };
  paint();
  await new Promise(resolve=>{ const mk=()=>setActions([{label:T(UI.shuffle),on:()=>{roll();paint();mk();}},{label:T(UI.keep),cls:'primary',on:()=>resolve()}]); mk(); });
  setActions([]); stampOn(card,'neutral',T(UI.processed));
  S.hudShown=true; hudRender();
  await coach(COACH.name[lang](S.name),'roast');
  await firstYear();
}
async function firstYear(){
  S.dayIdx=1; dateLine();
  await runEvent({id:'first',t:COACH.e1,c:COACH.e1c});
  await new Promise(resolve=>setActions([{label:T(UI.nextDay),cls:'primary pulse',on:()=>resolve()}]));
  await advanceDays(1+Math.floor(rnd()*4)); dateLine();
  const ev2={id:'money',t:COACH.e2,c:COACH.e2c};
  await new Promise(async resolve=>{
    await npcDialog('money');
    const card=eventCard(ev2,T(UI.event));
    setTimeout(()=>{ card.appendChild(el(`<div class="slip">${esc(T(COACH.e2w))}</div>`)); SFX.tick(); scrollDown(); },350);
    setActions(ev2.c.map(ch=>({label:T(ch.t),on:async()=>{
      S.decisions++; bumpPat(ch.tag); meSay(T(ch.t)); await wait(200);
      if(ch.wrong){ S.wagersLost++; stampOn(card,'wrong',T(UI.wrong)); S.lastMissWager={age:18,t:T(COACH.e2)}; }
      else { S.wagersWon++; stampOn(card,'called',T(UI.called)); }
      await wait(500); const parts=applyDelta(ch.d);
      card.querySelector('.slip').insertAdjacentHTML('beforeend',`<span class="odds">${UI.odds[lang](55)}</span>`);
      feed.appendChild(el(`<div class="result">${deltaHtml(parts)}</div>`)); scrollDown();
      await coach(T(ch.line), ch.wrong?'lift':'roast'); setActions([]); resolve();
    }})));
  });
  await goalCard();
  feed.appendChild(el(`<div class="skip">${esc(T(UI.firstSkip))}</div>`)); scrollDown(); S.date+=340*86400000; S.dayIdx+=3; S.daysInYear=0;
  await coach(T(COACH.yearEnd));
  await new Promise(resolve=>setActions([{label:T(UI.age1),cls:'primary pulse',on:()=>resolve()}]));
  await ageUpAnim(); ageUp(); await karne(); await wait(300);
  yearEndActions();
}
function yearEndActions(){
  const list=[{label:T(UI.nextDay),cls:'primary',on:()=>playDay()},{label:T(UI.enough),cls:'ghost',on:()=>sessionEnd()},{label:T(UI.share),cls:'ghost',on:()=>shareSheet()}];
  if(S.age>=22) list.push({label:T(UI.fast),cls:'ghost',on:()=>fastForward()});
  setActions(list);
}
async function playDay(){
  setActions([]);
  const n=skipDays(); await advanceDays(n);
  if(S.daysInYear>=365){ return birthday(); }
  dateLine();
  if(S.dayIdx===5 || (S.dayIdx%9===0)) { if(S.j<30) await coach(T(COACH.lowJoy),'lift'); else await coach(yearIntro(),'roast'); }
  if(S.life>1 && S.dayIdx===5 && S.prevTop){ await coach(COACH.callback[lang](S.prevTop)); }
  if(S.asideUsed<1 && rnd()<.12){ S.asideUsed++; await coach(T(pick(COACH.asides))); }
  if(S.mom>=75 && S.momCalled<2 && rnd()<.7){ await momCall(); }
  else {
    let item=null;
    if(S.env.length){ item={ev:S.env.shift(),legend:false}; sys(lang==='tr'?'Zarf açıldı':'Envelope opened'); SFX.tick(); } else { item=pickEvent(); }
    if(!item){ await coach(lang==='tr'?'Bugün olay yok. Deftere "dinlenme günü" yazdım; sen "boşluk" dersin.':'No event today. I wrote "rest day" in the notebook; you\'d call it "a void".'); }
    else { await runEvent(item.ev, item.legend); if(!S.alive) return; }
  }
  yearEndActions();
}
async function birthday(){
  S.daysInYear-=365; dateLine();
  await coach(UI.birthday[lang](S.age+1),'roast');
  if(S.goal===null || rnd()<.5){ await goalCard(); }
  await coach(T(COACH.yearEnd));
  await new Promise(resolve=>setActions([{label:T(UI.age1),cls:'primary',on:()=>resolve()}]));
  await ageUpAnim(); ageUp();
  if(rnd()<hazard()){ return death(); }
  await karne(); await wait(300); yearEndActions();
}
async function fastForward(){
  setActions([]); sys(lang==='tr'?'Hızlı yaşa: koç kararları otomatik verdi':'Live fast: the coach auto-picked');
  while(S.alive){
    const item=pickEvent(); if(item){ const ev=item.ev; const ch=pick(ev.c); S.decisions++; bumpPat(ch.tag); const out=ch.w?(rnd()*100<ch.w.p?ch.fail:ch.ok):(ch.mini?(rnd()<.5?ch.ok:ch.fail):ch); const d=out.d||{}; for(const k of ['h','j','b','l']) if(d[k]) S[k]=clamp(S[k]+d[k],0,100); if(d.m) S.m+=d.m; if(d.mom) S.mom=clamp(S.mom+d.mom,0,100); if(ch.w){ if(out===ch.fail) S.wagersWon++; else S.wagersLost++; } if(out.love) S.loves++; if(S.m<0) S.m=4; }
    S.date+=365*86400000; S.dayIdx+=Math.max(3,Math.round(14-S.age/8)); ageUp();
    if(S.age%5===0){ sys(`${S.age} · ${S.year}`); SFX.tick(); await wait(140); }
    if(rnd()<hazard() || S.age>=97) return death();
  }
}
function topPatterns(){ return Object.entries(S.pat).sort((a,b)=>b[1]-a[1]).slice(0,3); }

    <div class="nums"><div><b data-n="${worked}">0</b>${esc(UI.numsLbl[lang][0])}</div><div><b data-n="${S.loves}">0</b>${esc(UI.numsLbl[lang][1])}</div><div><b data-n="${S.wagersLost}">0</b>${esc(UI.numsLbl[lang][2])}</div></div>
    <div class="big" style="font-size:16px">${esc(UI.there[lang](S.wagersLost))}</div>
    <div><div class="lbl2">${esc(T(UI.patTitle))}</div>
      ${pats.length?pats.map(([k,v])=>`<div class="pat"><span>${esc(T(PAT[k]))}<div class="barp" style="width:${Math.round(v/maxP*100)}%"></div></span><b>${v} ${esc(T(UI.times))}</b></div>`).join(''):`<div class="pat"><span>—</span></div>`}</div>
    ${S.lastMissWager?`<div><div class="lbl2">${esc(T(UI.rightMoment))}</div><div style="font-family:var(--coach-font);font-style:italic">${S.lastMissWager.age} ${esc(T(UI.age))}: ${esc(S.lastMissWager.t)}</div></div>`:''}
    <div><div class="lbl2">${esc(T(UI.lastWord))}</div><div style="font-family:var(--coach-font);font-style:italic;font-size:17px">${esc(T(pick(COACH.lastWords)))}</div></div>
    <div class="unlock"><small>${esc(T(UI.unlockLbl))}</small>${esc(unlock)}</div>

function setLang(l){ lang=l; document.getElementById('langTR').classList.toggle('on',l==='tr'); document.getElementById('langEN').classList.toggle('on',l==='en');
  document.getElementById('langTR').setAttribute('aria-pressed',l==='tr'); document.getElementById('langEN').setAttribute('aria-pressed',l==='en');
  document.getElementById('subtitle').textContent=l==='tr'?'Sertifikasız Hayat Koçu':'Uncertified Life Coach';
  document.getElementById('foot').textContent=l==='tr'?'Tasarım maketi: gün gün ilerleyen hayat, konuşan karakterler, koçun iddiaları. Gerçek uygulama değil; metinler ve sayılar örnektir.':'Design mock: a day-by-day life, characters who talk, a coach who bets against you. Not the real app; lines and numbers are samples.';
  try{localStorage.setItem('motto-lang',l);}catch(e){}
  S=newState(1,[]); start(); }
function boot(){
